name: ADR validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Validate ADR conventions and links
        run: uv run --locked --extra dev python scripts/check_adrs.py
      - name: Test ADR validator
        run: uv run --locked --extra dev pytest tests/scripts/test_check_adrs.py
