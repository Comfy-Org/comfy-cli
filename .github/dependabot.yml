version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      ci-dependencies:
        patterns:
          - "*"
    ignore:
      # NEVER let Dependabot bump the Comfy-Org/github-workflows reusables: a caller
      # pins them TWICE (`uses:` SHA + `workflows_ref:` input) and Dependabot only
      # rewrites `uses:`, splitting the pair. The bump-*-callers fleet in
      # github-workflows moves both pins together. Dependabot names a reusable by
      # its FULL path, and a bare `dependency-name` is an exact match, so the exact
      # form covers `owner/repo` and the `/*` form the per-file names. Upstream's
      # own config uses the single `Comfy-Org/github-workflows*`, which also works;
      # the two-entry form is preferred here because Dependabot's `*` is unanchored
      # and a lone trailing star would also match any sibling repo whose name
      # merely starts with `github-workflows`.
      #
      # detect-unreviewed-merge.yml pins once (no `workflows_ref`), but it is
      # deliberately covered too: upstream's bump-detect-unreviewed-merge-callers
      # fleet already bumps it here, and a second bumper would only race it.
      - dependency-name: "Comfy-Org/github-workflows"
      - dependency-name: "Comfy-Org/github-workflows/*"
