name: "Test CLI Tool on GPU runners"

on:
  push:
    branches:
      - main
    paths:
      - "comfy_cli/**"
      - "!comfy_cli/test_**"
      # Changes to the e2e suite or to this job must run the job itself.
      - "tests/e2e/**"
      - ".github/workflows/run-on-gpu.yml"
  pull_request:
    branches:
      - main
    paths:
      - "comfy_cli/**"
      - "!comfy_cli/test_**"
      # Changes to the e2e suite or to this job must run the job itself.
      - "tests/e2e/**"
      - ".github/workflows/run-on-gpu.yml"

permissions:
  contents: read

jobs:
  test-cli-gpu:
    name: "Run Tests on GPU Runners"
    runs-on:
      group: gpu-runners
      labels: ${{ matrix.os }}-x64-gpu #
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
    env:
      # ComfyUI pins comfyui_manager==4.2.2 (manager_requirements.txt). Its
      # uv-compile conflict parser keeps only stderr lines containing "error"
      # or "conflict". Since uv 0.12.14, `uv pip compile` reports a failed
      # resolution as "error: No solution found ..." followed by indented
      # "cause:" lines, so 4.2.2 keeps just the header line, which names no
      # packages, and cm_cli no longer prints "Conflicting packages (by node
      # pack):". Manager 4.3 ("Fix uv conflict attribution") keeps the cause
      # lines. Remove this once ComfyUI's manager_requirements.txt is >= 4.3.
      MANAGER_OVERRIDE: "4.3"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check Nvidia
        run: |
          nvidia-smi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Check disk space
        run: |
          df -h

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Test CUDA auto-detection (real hardware)
        run: |
          pytest tests/comfy_cli/test_cuda_detect_real.py -v

      - name: Test e2e
        id: test-e2e
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_E2E: true
          TEST_E2E_COMFY_INSTALL_FLAGS: --nvidia
          TEST_E2E_COMFY_LAUNCH_FLAGS_EXTRA: ""
        run: |
          pytest tests/e2e

      - name: Retry test e2e but without gpu
        if: ${{ failure() && steps.test-e2e.conclusion == 'failure' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_E2E: true
        run: |
          pytest tests/e2e
