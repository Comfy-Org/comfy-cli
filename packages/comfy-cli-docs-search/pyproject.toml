[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-cli-docs-search"
version = "0.0.0" # Kept in sync with comfy-cli by scripts/set_release_version.py.
description = "Version-matched offline documentation vectors and LanceDB index for comfy-cli."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfy_cli_docs_search = ["assets/*.tar.gz", "assets/*.json", "py.typed"]
