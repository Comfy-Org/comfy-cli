name: "Test CLI Tool on GPU runners"

on:
  push:
    branches:
      - main
    paths:
      - "comfy_cli/**"
      - "!comfy_cli/test_**"
      - "!.github/**"
      - "!tests/**"
      - "!.coveragerc"
      - "!.gitignore"
  pull_request:
    # `labeled` is required on top of the default trigger set: without it a
    # freshly applied `gpu-ci` label would do nothing until the next push.
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - "comfy_cli/**"
      - "!comfy_cli/test_**"
      - "!.github/**"
      - "!tests/**"
      - "!.coveragerc"
      - "!.gitignore"

permissions:
  contents: read

jobs:
  test-cli-gpu:
    # PR runs are opt-in via the maintainer-applied `gpu-ci` label, because this
    # job checks out and executes PR code on self-hosted GPU runners. Push-to-main
    # runs stay automatic. The label persists across later pushes to the same PR,
    # so apply it only after reading the diff and remove it to re-gate the PR.
    # Prerequisite for the review-gated auto-builder in #786.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    name: "Run Tests on GPU Runners"
    runs-on:
      group: gpu-runners
      labels: ${{ matrix.os }}-x64-gpu #
    strategy:
      fail-fast: false
      matrix:
        os: [linux]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check Nvidia
        run: |
          nvidia-smi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Check disk space
        run: |
          df -h

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Test CUDA auto-detection (real hardware)
        run: |
          pytest tests/comfy_cli/test_cuda_detect_real.py -v

      - name: Test e2e
        id: test-e2e
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_E2E: true
          TEST_E2E_COMFY_INSTALL_FLAGS: --nvidia
          TEST_E2E_COMFY_LAUNCH_FLAGS_EXTRA: ""
        run: |
          pytest tests/e2e

      - name: Retry test e2e but without gpu
        if: ${{ failure() && steps.test-e2e.conclusion == 'failure' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_E2E: true
        run: |
          pytest tests/e2e
