name: ADR validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Validate ADR conventions and links
        run: uv run --locked --extra dev python scripts/check_adrs.py
      - name: Test ADR validator
        run: uv run --locked --extra dev pytest tests/scripts/test_check_adrs.py
