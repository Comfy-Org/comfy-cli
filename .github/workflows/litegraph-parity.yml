name: litegraph-parity

# comfy_cli/layout.py places nodes from a model of how ComfyUI_frontend's LiteGraph
# renders them. That renderer lives in another repository on another release cadence,
# and until this job existed nothing failed when it moved -- the symptom would surface
# as overlapping nodes on an agent-built canvas, reported by a user, weeks later.
#
# Scheduled rather than per-PR on purpose: the input that changes is upstream, not this
# repo's diff, so a PR gate would burn a network call on every push and still miss the
# drift that happens between them. It also runs on PRs that touch the layout model, and
# on demand.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, so a drift is found at the start of a week
  pull_request:
    paths:
      - "comfy_cli/layout.py"
      - "scripts/check_litegraph_parity.py"
      - ".github/workflows/litegraph-parity.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "ComfyUI_frontend ref to check against"
        required: false
        default: "main"

permissions:
  contents: read
  issues: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        # The project's own deps, not a bare pytest: importing anything under
        # tests/comfy_cli/ pulls in the package, which needs `rich` among others. A
        # `pip install pytest` alone collects 14 errors before a single test runs.
        run: uv sync --extra dev --locked

      - name: Parser unit tests
        # Offline. The regex is the part most likely to break silently, and it must be
        # known-good before a failure of the step below can be read as real drift.
        run: uv run --locked --extra dev pytest tests/comfy_cli/test_litegraph_parity.py -q

      - name: Check constants against upstream
        id: check
        run: |
          set +e
          uv run --locked --extra dev python scripts/check_litegraph_parity.py --ref "${{ inputs.ref || 'main' }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report
        # Exit 1 (drift) and exit 2 (could not read upstream) are different outcomes and
        # must not be collapsed: a moved file or a network blip is not evidence that the
        # constants diverged, and treating it as such trains people to ignore this job.
        run: |
          case "${{ steps.check.outputs.status }}" in
            0)
              echo "geometry constants match upstream" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "## CONSTANTS HAVE DRIFTED" >> "$GITHUB_STEP_SUMMARY"
              echo "\`comfy_cli/layout.py\` no longer matches upstream LiteGraph geometry. Re-run \`python scripts/check_litegraph_parity.py\` locally, update the model, and re-baseline \`tests/comfy_cli/test_layout.py\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            2)
              echo "## CHECK INCONCLUSIVE" >> "$GITHUB_STEP_SUMMARY"
              echo "The upstream or production source could not be read. No parity conclusion was reached; inspect and re-run \`python scripts/check_litegraph_parity.py\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "## CHECK INCONCLUSIVE" >> "$GITHUB_STEP_SUMMARY"
              echo "The parity script returned an unexpected status; inspect the job log." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
