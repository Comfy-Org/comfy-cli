# Description: Thin caller for the shared public-repo-hygiene reusable workflow
# in Comfy-Org/github-workflows, which owns the checker AND its known-public
# allowlist. This replaces the in-tree copy this repo used to carry.
#
# Why the checker is not in this repo any more: the old job ran
# the checker straight out of the PR's own checkout, so a PR could widen the
# allowlist — or disable the scan — and go green. The reusable loads the
# checker from the pinned `workflows_ref` commit instead, so a PR here cannot
# reach it through this workflow's inputs. The allowlist is deliberately NOT
# an input, for the same reason.
#
# The pin is kept fresh by bump-public-repo-hygiene-callers.yml once this repo
# is enrolled in the PUBLIC_REPO_HYGIENE_CALLERS roster.
name: Public Repo Hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    permissions:
      contents: read
    uses: Comfy-Org/github-workflows/.github/workflows/public-repo-hygiene.yml@e203fbcc66ae92a4d492ca9cf6dc6a3d844a9b4b # github-workflows main (3b2c8ca)
    with:
      # REQUIRED, and must equal the `uses:` SHA above — the reusable asserts
      # they match, which is what pins the checker to the reviewed commit.
      workflows_ref: 3b2c8ca1f52056b54453a659fdb4473cfc88aa0e
      # `HAILUO-03` is MiniMax's Hailuo 03 model, named in the curated
      # knowledge bundle and asserted in tests. It is a product name that
      # happens to match the ticket-ID shape, not an internal reference.
      # `HALO-03` is a fictional product id used as test fixture data in
      # tests/comfy_cli/test_knowledge.py and test_knowledge_attach.py — not a
      # real ticket.
      ticket_allowlist: HAILUO-03,HALO-03
      # No `exclude_paths:` here, deliberately. Every entry this caller used to
      # carry was a false positive in the checker itself — Hugging Face model
      # URLs and HF `owner/name` model repos read as unlisted GitHub repos —
      # and all of them are fixed upstream as of the pin above. The one
      # remaining entry, `.github/workflows/refresh-cql-catalogs.yml`, is gone
      # because that file no longer names its private source: the coordinates
      # moved into secrets. An exclusion suppresses the scan for a whole path
      # forever, including code not yet written, so the bar for adding one back
      # is that the finding is unfixable both here and upstream.
