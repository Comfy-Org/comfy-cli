name: Publish to PyPI

on:
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  build-n-publish-pypi:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build and LanceDB pack dependencies
        run: >-
          python -m pip install --upgrade pip build tomlkit jsonschema
          "lancedb==0.25.0" "pyarrow>=16,<25" "onnxruntime>=1.23.2,<1.24" "tokenizers>=0.15,<1"

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set matching CLI and docs-pack versions
        run: python scripts/set_release_version.py "${VERSION}"

      - name: Check bundled documentation
        run: python scripts/build_docs_bundle.py --check

      - name: Build and validate offline LanceDB docs pack
        run: |
          python scripts/build_docs_lancedb.py
          python scripts/build_docs_lancedb.py --check

      - name: Build the version-matched docs-search package
        run: python -m build --sdist --wheel --outdir dist/ packages/comfy-cli-docs-search

      - name: Build comfy-cli distribution
        run: python -m build --sdist --wheel --outdir dist/

      # - name: Publish distribution to TestPyPI for Validation
      #   uses: pypa/gh-action-pypi-publish@v1.8.14
      #   with:
      #     repository_url: https://test.pypi.org/legacy/

      # - name: Clear pip cache
      #   run: pip cache purge

      # - name: Install Comfy CLI from Test Pypi and Test
      #   run: |
      #     for i in {1..3}; do
      #       pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple comfy-cli==${{env.VERSION}} && break || sleep 5
      #     done
      #     comfy --help

      - name: Publish distribution to Official PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  test-pip-installation:
    name: Test Comfy CLI Installation via pip
    needs: build-n-publish-pypi  # This job runs after build-n-publish completes successfully
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Comfy CLI via pip and Test
        run: |
          # PyPI's index can lag behind a successful upload by a minute or
          # two, so retry before failing the job.
          for i in 1 2 3 4 5 6 7 8; do
            pip install --no-cache-dir "comfy-cli==${VERSION}" && exit 0
            echo "Attempt $i: package not yet available on PyPI, waiting 15s..."
            sleep 15
          done
          echo "::error::Failed to install comfy-cli==${VERSION} after 8 attempts"
          exit 1

      - name: Test Comfy CLI Help
        run: comfy --help

  test-docs-search-installation:
    name: Test optional LanceDB docs search from PyPI
    needs: build-n-publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install optional docs-search extra
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if pip install --no-cache-dir "comfy-cli[docs-search]==${VERSION}"; then
              exit 0
            fi
            echo "Attempt ${attempt}: package not yet available on PyPI, waiting 15s..."
            sleep 15
          done
          echo "::error::Failed to install comfy-cli[docs-search]==${VERSION} after 8 attempts"
          exit 1

      - name: Search the shipped corpus offline
        run: |
          comfy --json docs status
          comfy --json docs search "stuck job wait timeout" --mode hybrid
